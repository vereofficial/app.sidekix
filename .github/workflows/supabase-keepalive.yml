# Prevent Supabase Free-tier inactivity pause (7 days with no API/DB activity).
# Repository secrets (Settings → Secrets and variables → Actions → Secrets):
#   EXPO_PUBLIC_SUPABASE_URL, EXPO_PUBLIC_SUPABASE_ANON_KEY
name: Supabase keepalive

on:
  schedule:
    # Mon, Wed, Fri at 14:00 UTC — well inside the 7-day window.
    - cron: '0 14 * * 1,3,5'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - name: Verify credentials are configured
        run: |
          if [ -z "$EXPO_PUBLIC_SUPABASE_URL" ]; then
            echo "::error::Missing EXPO_PUBLIC_SUPABASE_URL. Add it under Settings → Secrets and variables → Actions → Secrets (not Environment secrets unless this job uses an environment)."
            exit 1
          fi
          if [ -z "$EXPO_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error::Missing EXPO_PUBLIC_SUPABASE_ANON_KEY. Add the anon public key from Supabase → Settings → API."
            exit 1
          fi
          case "$EXPO_PUBLIC_SUPABASE_URL" in
            https://*.supabase.co) echo "Supabase URL looks valid (host hidden)." ;;
            *)
              echo "::warning::URL should look like https://YOUR_REF.supabase.co"
              ;;
          esac

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Ping Supabase
        run: node scripts/supabase-keepalive.mjs
